name: preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Save /digest/2026-10-28 from a running rig
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
        run: |
          pnpm start > rig.log 2>&1 &
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8787/health
          mkdir site
          curl -fsS http://localhost:8787/digest/2026-10-28 -o site/index.html
          grep -o '<span class="marker">[^<]*' site/index.html | sed 's/.*>//' | sed 's/./*/g'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
